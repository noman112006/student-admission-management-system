<!DOCTYPE html>
<html>
<head>
<title>Add New Course</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: linear-gradient(135deg,#eaf2fb,#d6e5f5);
}

.header {
    height: 70px;
    background: linear-gradient(90deg,#0b3c7c,#1559a6);
    color: white;
    display: flex;
    align-items: center;
    padding: 0 30px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    display: flex;
    min-height: calc(100vh - 70px);
}

.sidebar {
    width: 220px;
    background: white;
    padding: 25px 15px;
}

.sidebar a {
    display: block;
    padding: 14px 15px;
    margin-bottom: 10px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
    border-radius: 7px;
}

.sidebar a:hover,
.sidebar .active {
    background: #eaf2fb;
    color: #0b3c7c;
}

.main {
    flex: 1;
    padding: 35px;
}

.title {
    font-size: 30px;
    color: #0b3c7c;
    font-weight: bold;
    margin-bottom: 30px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 12px;
}

.top {
    margin-bottom: 25px;
}

.back {
    display: inline-block;
    padding: 12px 20px;
    background: #0b3c7c;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.section {
    border-top: 2px solid #0b3c7c;
    padding-top: 25px;
}

.section h3 {
    color: #0b3c7c;
    margin-bottom: 25px;
}

.row {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.field {
    flex: 1;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    outline: none;
}

textarea {
    height: 100px;
    resize: none;
}

/* VALIDATION */

input.invalid,
textarea.invalid {
    border: 2px solid red;
}

.field-error {
    color: red;
    font-size: 13px;
    margin-top: 5px;
    min-height: 16px;
}

.buttons {
    margin-top: 30px;
    display: flex;
}

button {
    padding: 12px 25px;
    background: #0b3c7c;
    color: white;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
}

.cancel {
    background: #777;
}

.save {
    margin-left: auto;
}

</style>
</head>

<body>

<div class="header">
    STUDENT ADMISSION SYSTEM
</div>

<div class="container">

<div class="sidebar">

    <a href="dashboard.php">Dashboard</a>

    <a href="Students.html">Students</a>

    <a href="Courses.php" class="active">Courses</a>

    <a href="Admissions.php">Admissions</a>

    <a href="logout.php">Logout</a>

</div>

<div class="main">

<div class="title">
    + Add New Course
</div>

<div class="box">

<form id="courseForm" onsubmit="return validateForm()">

<div class="top">

<a href="Courses.html" class="back">
    Back to Courses
</a>

</div>

<div class="section">

<h3>Enter the details of Course:</h3>

<div class="row">

<div class="field">

<label>Course Code *</label>

<input
    type="text"
    id="courseCode"
    placeholder="Enter course code">

<div
    id="courseCodeError"
    class="field-error">
</div>

</div>


<div class="field">

<label>Department *</label>

<input
    type="text"
    id="department"
    placeholder="Enter department name">

<div
    id="departmentError"
    class="field-error">
</div>

</div>


<div class="field">

<label>Course Name *</label>

<input
    type="text"
    id="courseName"
    placeholder="Enter course name">

<div
    id="courseNameError"
    class="field-error">
</div>

</div>

</div>


<div class="row">

<div class="field">

<label>Duration *</label>

<input
    type="text"
    id="duration"
    placeholder="Enter duration">

<div
    id="durationError"
    class="field-error">
</div>

</div>


<div class="field">

<label>Total Seats *</label>

<input
    type="number"
    id="totalSeats"
    placeholder="Enter total seats"
    min="1">

<div
    id="totalSeatsError"
    class="field-error">
</div>

</div>


<div class="field">

<label>Fees *</label>

<input
    type="number"
    id="fees"
    placeholder="Enter fees"
    min="1">

<div
    id="feesError"
    class="field-error">
</div>

</div>

</div>


<div class="row">

<div class="field">

<label>Description</label>

<textarea
    id="description"
    placeholder="Enter course description">
</textarea>

</div>

</div>


<div class="buttons">

<button
    type="button"
    class="cancel"
    onclick="cancelCourse()">

Cancel

</button>

<button
    type="submit"
    class="save">

Save Course

</button>

</div>

</div>

</form>

</div>

</div>

</div>


<script>

/* =========================
   VALIDATION
========================= */

function validateForm() {

    let valid = true;


    let courseCode =
        document.getElementById("courseCode");

    let department =
        document.getElementById("department");

    let courseName =
        document.getElementById("courseName");

    let duration =
        document.getElementById("duration");

    let totalSeats =
        document.getElementById("totalSeats");

    let fees =
        document.getElementById("fees");


    /* Clear old errors */

    let fields = [
        courseCode,
        department,
        courseName,
        duration,
        totalSeats,
        fees
    ];

    let errors = [
        "courseCodeError",
        "departmentError",
        "courseNameError",
        "durationError",
        "totalSeatsError",
        "feesError"
    ];


    for (let i = 0; i < fields.length; i++) {

        fields[i].classList.remove("invalid");

        document.getElementById(
            errors[i]
        ).innerHTML = "";
    }


    /* Course Code */

    if (courseCode.value.trim() == "") {

        courseCode.classList.add("invalid");

        document.getElementById(
            "courseCodeError"
        ).innerHTML =
            "Course Code is required.";

        valid = false;
    }


    /* Department */

    if (department.value.trim() == "") {

        department.classList.add("invalid");

        document.getElementById(
            "departmentError"
        ).innerHTML =
            "Department is required.";

        valid = false;
    }


    /* Course Name */

    if (courseName.value.trim() == "") {

        courseName.classList.add("invalid");

        document.getElementById(
            "courseNameError"
        ).innerHTML =
            "Course Name is required.";

        valid = false;
    }


    /* Duration */

    if (duration.value.trim() == "") {

        duration.classList.add("invalid");

        document.getElementById(
            "durationError"
        ).innerHTML =
            "Duration is required.";

        valid = false;
    }


    /* Total Seats */

    if (totalSeats.value.trim() == "") {

        totalSeats.classList.add("invalid");

        document.getElementById(
            "totalSeatsError"
        ).innerHTML =
            "Total Seats is required.";

        valid = false;

    } else if (Number(totalSeats.value) <= 0) {

        totalSeats.classList.add("invalid");

        document.getElementById(
            "totalSeatsError"
        ).innerHTML =
            "Total Seats must be greater than 0.";

        valid = false;
    }


    /* Fees */

    if (fees.value.trim() == "") {

        fees.classList.add("invalid");

        document.getElementById(
            "feesError"
        ).innerHTML =
            "Fees is required.";

        valid = false;

    } else if (Number(fees.value) <= 0) {

        fees.classList.add("invalid");

        document.getElementById(
            "feesError"
        ).innerHTML =
            "Fees must be greater than 0.";

        valid = false;
    }


    return valid;
}


/* =========================
   REMOVE ERROR WHILE TYPING
========================= */

let validationFields = [
    ["courseCode", "courseCodeError"],
    ["department", "departmentError"],
    ["courseName", "courseNameError"],
    ["duration", "durationError"],
    ["totalSeats", "totalSeatsError"],
    ["fees", "feesError"]
];


for (let i = 0; i < validationFields.length; i++) {

    document
        .getElementById(validationFields[i][0])
        .addEventListener(
            "input",
            function() {

                this.classList.remove("invalid");

                document.getElementById(
                    validationFields[i][1]
                ).innerHTML = "";

            }
        );
}


/* =========================
   CANCEL
========================= */

function cancelCourse() {

    document
        .getElementById("courseForm")
        .reset();

    let fields = [
        "courseCode",
        "department",
        "courseName",
        "duration",
        "totalSeats",
        "fees"
    ];

    let errors = [
        "courseCodeError",
        "departmentError",
        "courseNameError",
        "durationError",
        "totalSeatsError",
        "feesError"
    ];

    for (let i = 0; i < fields.length; i++) {

        document
            .getElementById(fields[i])
            .classList.remove("invalid");

        document.getElementById(
            errors[i]
        ).innerHTML = "";
    }
}

</script>

</body>
</html>
